[project]
name = "lds-api"
version = "0.1.0"
description = "API de LDS Connect — plateforme de la Ligue de la Souveraineté"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "segno>=1.6",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "faker>=28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lds_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/lds_api/seed/**" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# TestClient de Starlette annonce le passage à « httpx2 » : sans effet sur les tests, la
# dépendance sera changée quand FastAPI la proposera par défaut.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
