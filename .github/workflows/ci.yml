name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lds
          POSTGRES_PASSWORD: lds
          POSTGRES_DB: lds_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lds" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: apps/api
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://lds:lds@localhost:5432/lds_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: Web (eslint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  e2e:
    name: Bout en bout (Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lds
          POSTGRES_PASSWORD: lds
          POSTGRES_DB: lds
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lds" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://lds:lds@localhost:5432/lds
      REDIS_URL: redis://localhost:6379/0
      SMS_SIMULATOR_URL: http://127.0.0.1:8090
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: API (clés éphémères, migration, seed, démarrage)
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run python -m lds_api.cli gen-keys >> "$GITHUB_ENV"
      - working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run python -m lds_api.cli seed
          nohup uv run uvicorn lds_api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
      - name: Simulateur SMS (codes de vote lus par le test)
        working-directory: apps/simulateurs
        run: nohup ../api/.venv/bin/uvicorn app:app --host 127.0.0.1 --port 8090 > sim.log 2>&1 &
      - name: Site (build de production et démarrage)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start > web.log 2>&1 &
          npx wait-on -t 60000 http-get://127.0.0.1:3000 http-get://127.0.0.1:8000/api/v1/health http-get://127.0.0.1:8090/health
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
      - working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
      - name: Journaux en cas d'échec
        if: failure()
        run: |
          echo "--- API ---"; tail -n 100 apps/api/api.log || true
          echo "--- Web ---"; tail -n 100 apps/web/web.log || true
          echo "--- Simulateur ---"; tail -n 50 apps/simulateurs/sim.log || true
